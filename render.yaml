services:
  - type: web
    name: kannada-v3-backend
    env: node
    plan: free
    buildCommand: npm install && cd server && npm install && npm run build
    startCommand: node server/dist/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-1.5-flash
      - key: GEMINI_API_KEY
        sync: false
      - key: CLIENT_ORIGIN
        value: "*"
